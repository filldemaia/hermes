# Hermes — Configuració Nginx per a filldemaia.cat
# Desplegament darrere del reverse proxy Nginx, al domini arrel (sense subdomini).
#
# Instal·lació:
#   cp hermes.conf /etc/nginx/sites-available/hermes
#   ln -s /etc/nginx/sites-available/hermes /etc/nginx/sites-enabled/hermes
#   nginx -t && systemctl reload nginx
#
# ESTAT ACTUAL: HTTP (80) + HTTPS (443) amb certificat autosignat. Cloudflare
# fa de terminador TLS en mode Full/Flexible segons config. Per mode Full (strict)
# cal el Cloudflare Origin Certificate (vegeu bloc HTTPS al final).

upstream hermes_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ── Restauració de la IP real del client darrere de Cloudflare ───────────────
# Sense això, tots els logs i accessos mostrarien la IP del proxy de Cloudflare.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name filldemaia.cat www.filldemaia.cat;

    # Mida màxima de pujada (l'app no rep pujades grans, però evitem sorpreses)
    client_max_body_size 16m;

    # Seguretat
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Proxy cap a l'aplicació Node.js
    location / {
        proxy_pass http://hermes_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # El streaming de vídeo el serveix Node (dist/index.js) amb suport de Range.
}

# ── HTTPS (actiu amb certificat autosignat) ───────────────────────────────────
# Certificat atual: autosignat a /etc/ssl/hermes/ (vàlid ~2.3 anys).
# Per passar al Cloudflare Origin Certificate (mode Full strict):
#   1. Cloudflare → SSL/TLS → Origin Server → Create Certificate
#   2. Desar el cert a /etc/ssl/hermes/hermes.crt i la clau a hermes.key
#   3. Posar el mode SSL/TLS de Cloudflare a "Full (strict)"
#   4. `nginx -t && systemctl reload nginx`
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name filldemaia.cat www.filldemaia.cat;

    ssl_certificate     /etc/ssl/hermes/hermes.crt;
    ssl_certificate_key /etc/ssl/hermes/hermes.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 16m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://hermes_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

}
